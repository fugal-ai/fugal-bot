# TEST ONLY overlay used by scripts/smoke.sh: adds the scripted tool-calling
# "brain" as a stand-in model endpoint. It sits on its own internal network
# with the model proxy only: like a real endpoint, the bot reaches it through
# the model proxy and in no other way.
services:
  brain:
    build:
      context: ./scripts/scripted-brain
    image: ${BRAIN_IMAGE:-fugal-bot-scripted-brain:test}
    environment:
      # Set by smoke.sh to the stand-in API key; the brain then refuses any other.
      BRAIN_EXPECT_KEY: ${SMOKE_CANARY_KEY:-}
      BRAIN_DUMP: ${BRAIN_DUMP:-}   # 1 = log whole request bodies (debugging)
      # Put in front of every taoq command the brain runs; the first-conversation
      # test sets TAOQ_FIXTURE=... here for a run without network (scripts/first-conversation.sh).
      BRAIN_TAOQ_ENV: ${BRAIN_TAOQ_ENV:-}
    networks: [smokenet]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
  modelproxy:
    networks: [smokenet]   # added to its own two networks
    depends_on: [brain]

networks:
  smokenet:
    internal: true
