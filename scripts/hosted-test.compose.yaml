# TEST ONLY, used by scripts/hosted-test.sh on top of
#   compose.yaml : compose.cathedral.yaml : compose.hosted.yaml : scripts/smoke.compose.yaml
# It runs the HOSTED layout on an ordinary Docker host without using the real
# host network: every service joins one shared network namespace (the "netns"
# container), so they reach each other on 127.0.0.1:<port> exactly as in a
# room. Unlike scripts/loopback-test.compose.yaml it leaves the data where the
# hosted layout puts it, in bind mounts under DATA_DIR, because the backup and
# restore one-shots are tested against exactly those mounts.
#
# Added for the test: "store", a throwaway object store on loopback that
# stands in for the presigned-URL storage (scripts/object-store.py), and
# "telegram", a stand-in Telegram Bot API (scripts/telegram-stub.py).
services:
  netns:
    image: caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    entrypoint: ["sleep", "infinity"]
    networks: [loopnet]
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m

  bot:
    network_mode: "service:netns"
    networks: !reset null
    build:
      context: ./bot
      network: default   # test host: never build with the host network
    depends_on: [netns]
    # The room's limit (the controller's FB_BOT_MEM_LIMIT default, BOT_MEM_LIMIT
    # in the .env this test writes). With 2560m, OpenClaw v2026.11.7 plus the
    # bot's browser peaked at 2.52 GB (94%), and one run lost its shell child
    # and then the gateway itself mid-turn. hosted-test.sh reports the peak
    # and fails on any OOM kill or gateway restart.
    mem_limit: 4g
    environment:
      # Test only: the Telegram channel's Bot API is the "telegram" stub below,
      # once hosted-test.sh turns Telegram on (empty until then; a room never
      # sets it).
      TELEGRAM_API_ROOT: ${HOSTED_TEST_TELEGRAM_API_ROOT:-}
  modelproxy:
    network_mode: "service:netns"
    networks: !reset null
    depends_on: [netns]
  gate:
    network_mode: "service:netns"
    networks: !reset null
    depends_on: [netns]
  proxy:
    network_mode: "service:netns"
    networks: !reset null
    build:
      context: ./proxy
      dockerfile: Dockerfile.nocap
      network: default   # test host: never build with the host network
    environment:
      # Test only: also listen on the shared namespace's own interface so the
      # port published by "netns" reaches it. In a room it stays 127.0.0.1.
      PROXY_LISTEN_HOST: ""
  brain:
    network_mode: "service:netns"
    networks: !reset null
    depends_on: [netns]
  tunnel:
    network_mode: "service:netns"
    networks: !reset null
  backup:
    network_mode: "service:netns"
    networks: !reset null
    depends_on: [netns]
  restore:
    network_mode: "service:netns"
    networks: !reset null
    depends_on: [netns]

  store:
    network_mode: "service:netns"
    networks: !reset null
    image: ${BRAIN_IMAGE:-fugal-bot-scripted-brain:test}   # any image with python3
    entrypoint: ["python3", "-I", "-u", "/object-store.py", "127.0.0.1", "18999", "/store"]
    user: "${HOSTED_TEST_UID:?set by scripts/hosted-test.sh}"
    depends_on: [netns]
    volumes:
      - ${HOSTED_TEST_STORE_SCRIPT:?set by scripts/hosted-test.sh}:/object-store.py:ro
      - ${HOSTED_TEST_STORE_DIR:?set by scripts/hosted-test.sh}:/store
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25

  telegram:
    # A stand-in Telegram Bot API on loopback (scripts/telegram-stub.py): the
    # Telegram path of a schedule request is tested without Telegram.
    network_mode: "service:netns"
    networks: !reset null
    image: ${BRAIN_IMAGE:-fugal-bot-scripted-brain:test}   # any image with python3
    entrypoint: ["python3", "-I", "-u", "/telegram-stub.py", "127.0.0.1", "18998"]
    user: "${HOSTED_TEST_UID:?set by scripts/hosted-test.sh}"
    depends_on: [netns]
    volumes:
      - ${HOSTED_TEST_TELEGRAM_SCRIPT:?set by scripts/hosted-test.sh}:/telegram-stub.py:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25

networks:
  loopnet: {}
