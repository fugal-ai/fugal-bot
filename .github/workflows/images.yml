# Builds and publishes the four Fugal Bot images to GitHub Container Registry,
# so hosts can pull them (BOT_IMAGE / MODELPROXY_IMAGE / GATE_IMAGE /
# PROXY_IMAGE) instead of building. Images are traceable to the commit that
# built them.
#
# It also packs the "room bundle", fugal-bot-room-<version>.tgz: compose.yaml,
# compose.cathedral.yaml, compose.hosted.yaml and an images.env with the four
# digest-pinned image references, which is all a host needs besides its own
# .env (no source tree: nothing is built there). On a tag the bundle is attached to
# the GitHub release of that tag; on every run it is a workflow artifact.
name: images

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/fugal-ai

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      bot: ${{ steps.bot.outputs.digest }}
      modelproxy: ${{ steps.modelproxy.outputs.digest }}
      gate: ${{ steps.gate.outputs.digest }}
      proxy: ${{ steps.proxy.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stdlib only, loopback only: a fake model endpoint runs inside the test.
      - name: Unit tests (model proxy)
        run: python3 -I modelproxy/test_modelproxy.py

      # Stdlib only, loopback only. The one test that needs the controller's
      # repository (a token minted by its own code) is skipped here.
      - name: Unit tests (gate)
        run: python3 -I gate/test_gate.py

      # Node only, no network: the starter-file rules (new, updated, edited, retired).
      - name: Unit tests (seed files)
        run: node bot/test_seed.mjs

      # Node only, no network: the checked patch engine for OpenClaw's built
      # files and the owner-name rename (that part needs node:sqlite; skipped
      # on an older Node). The real patch list is applied in the image build.
      - name: Unit tests (OpenClaw patches, owner name)
        run: node bot/test_patches.mjs

      # Stdlib only, no network: replays a recorded finney read (bot/tools/fixtures).
      - name: Unit tests (chain tool, taoq)
        run: python3 -I bot/tools/test_taoq.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and build date
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          for img in fugal-bot fugal-bot-modelproxy fugal-bot-gate fugal-bot-proxy; do
            tags="$REGISTRY/$img:$SHA"
            if [ "$REF_TYPE" = tag ]; then tags="$tags,$REGISTRY/$img:$REF_NAME"; fi
            key=$(echo "$img" | tr '-' '_')
            echo "${key}=${tags}" >> "$GITHUB_OUTPUT"
          done
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push fugal-bot
        id: bot
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bot
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.fugal_bot }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}

      # The only image for two platforms: the same program is also the central
      # gateway, which runs on an arm64 server; the room images stay amd64.
      # Its Dockerfile has no RUN step (base image, COPY, metadata), so the
      # arm64 variant is assembled without emulation. A RUN step added later
      # would need QEMU set up before this step.
      - name: Build and push fugal-bot-modelproxy (amd64 + arm64)
        id: modelproxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: modelproxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.fugal_bot_modelproxy }}

      - name: Build and push fugal-bot-gate
        id: gate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gate
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.fugal_bot_gate }}

      # The proxy is published from Dockerfile.nocap (Caddy from its checksummed
      # release archive), NOT from the official caddy image: the official image
      # sets a file capability on its binary, and layers carrying file
      # capabilities cannot be unpacked on hosts whose file system cannot store
      # them (e.g. gVisor sandboxes such as Cathedral rooms). This one works
      # everywhere, including the default layout.
      - name: Build and push fugal-bot-proxy
        id: proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: proxy
          file: proxy/Dockerfile.nocap
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.fugal_bot_proxy }}

      - name: Digests for .env
        env:
          BOT: ${{ steps.bot.outputs.digest }}
          MODELPROXY: ${{ steps.modelproxy.outputs.digest }}
          GATE: ${{ steps.gate.outputs.digest }}
          PROXY: ${{ steps.proxy.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Images built from commit \`$SHA\`"
            echo
            echo '```'
            echo "BOT_IMAGE=$REGISTRY/fugal-bot@$BOT"
            echo "MODELPROXY_IMAGE=$REGISTRY/fugal-bot-modelproxy@$MODELPROXY"
            echo "GATE_IMAGE=$REGISTRY/fugal-bot-gate@$GATE"
            echo "PROXY_IMAGE=$REGISTRY/fugal-bot-proxy@$PROXY"
            echo '```'
            echo
            echo "\`fugal-bot-modelproxy\` is one index for linux/amd64 and linux/arm64; the others are linux/amd64."
          } >> "$GITHUB_STEP_SUMMARY"

  # The room bundle. A separate job, so that only this one may write to the
  # repository's releases (and it has no registry access).
  bundle:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pack fugal-bot-room-<version>.tgz
        id: pack
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          BOT: ${{ needs.images.outputs.bot }}
          MODELPROXY: ${{ needs.images.outputs.modelproxy }}
          GATE: ${{ needs.images.outputs.gate }}
          PROXY: ${{ needs.images.outputs.proxy }}
        run: |
          set -eu
          if [ "$REF_TYPE" = tag ]; then version=$REF_NAME; else version="sha-$(echo "$SHA" | cut -c1-12)"; fi
          mkdir bundle
          {
            echo "BOT_IMAGE=$REGISTRY/fugal-bot@$BOT"
            echo "MODELPROXY_IMAGE=$REGISTRY/fugal-bot-modelproxy@$MODELPROXY"
            echo "GATE_IMAGE=$REGISTRY/fugal-bot-gate@$GATE"
            echo "PROXY_IMAGE=$REGISTRY/fugal-bot-proxy@$PROXY"
          } > bundle/images.env
          # Four lines, each pinned by a full sha256 digest, or no bundle at all.
          test "$(grep -c -E '^[A-Z]+_IMAGE=ghcr\.io/[a-z0-9./-]+@sha256:[0-9a-f]{64}$' bundle/images.env)" = 4
          cp compose.yaml compose.cathedral.yaml compose.hosted.yaml bundle/
          # The bundle must stand alone: compose reads these files, with the
          # hosted profile and both one-shots, from a directory that holds
          # nothing else. Made-up values; nothing is pulled or started.
          (cd bundle && env COMPOSE_FILE=compose.yaml:compose.cathedral.yaml:compose.hosted.yaml COMPOSE_PROFILES=hosted \
              DATA_DIR=/workspace/fugal-bot-data ACCESS_PASSWORD=check-only-not-a-secret-0123456789abcdef \
              MODEL_BASE_URL=https://model.invalid/v1 MODEL_NAME=check-only TUNNEL_TOKEN=check-only \
              docker compose --env-file images.env --profile backup --profile restore config --quiet)
          test "$(ls bundle | tr '\n' ' ')" = "compose.cathedral.yaml compose.hosted.yaml compose.yaml images.env "
          name="fugal-bot-room-$version.tgz"
          # Same commit, same digests -> the same archive, byte for byte.
          # The files sit at the top level of the archive (no directory entry).
          (cd bundle && tar --sort=name --owner=0 --group=0 --numeric-owner --mode=0644 \
              --mtime="$(git log -1 --format=%cI)" -cf - -- *) | gzip -n -9 > "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### Room bundle \`$name\`"
            echo
            echo '```'
            tar -tzf "$name"
            echo
            sha256sum "$name"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}
          if-no-files-found: error

      # `gh` is part of the runner image. An existing release for the tag is
      # kept as it is; only the asset is added (or replaced on a re-run).
      - name: Attach the bundle to the release of this tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.pack.outputs.name }}
        run: |
          set -eu
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "Images and the room bundle built from tag $TAG. The image digests are in images.env inside $ASSET."
          fi
          gh release upload "$TAG" "$ASSET" --clobber
