# Overlay for a HOSTED bot: one of many bots run for their owners by a site
# (a "controller"), each in its own room, shown in a frame on the site's page.
# Used on top of compose.yaml and compose.cathedral.yaml (all services on the
# host network, data under DATA_DIR), and switched on by the profile "hosted":
#
#   COMPOSE_FILE=compose.yaml:compose.cathedral.yaml:compose.hosted.yaml
#   COMPOSE_PROFILES=hosted
#   docker compose up -d --no-build
#
# What changes compared with the quick-tunnel setup:
#   - "tunnel" becomes a Cloudflare NAMED tunnel (a fixed hostname that the
#     controller created) instead of a quick tunnel with a random address.
#     The services of the profile "tunnel" (tunnel-guard, tunnel-url) do not
#     start, and PUBLIC_HOSTNAME stays empty: the proxy keeps listening on
#     127.0.0.1:PORT in plain HTTP and TLS ends at Cloudflare.
#   - Sign-in is by one-time token (GATE_SSO=on and the other GATE_* values in
#     .env; compose.yaml hands them to the gate and the proxy). This file does
#     not force it: a named tunnel with the password gate also works.
#   - "backup" and "restore" are declared: one-shots that `up` never starts.
#
# The tunnel's public hostname and where it sends traffic are set on
# Cloudflare's side (the tunnel's ingress rule), not here: it must point at
# http://127.0.0.1:<PORT>, the proxy.
services:
  tunnel:
    profiles: !override [hosted]
    # The token is read by cloudflared from the environment (TUNNEL_TOKEN). It
    # is never put on the command line, where every process on the host
    # network could read it (and cloudflared's own /debug/pprof/cmdline on the
    # metrics port would serve it). The metrics port is bound to loopback.
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run", "--protocol", "http2"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN (the named tunnel's token) in .env}
    # Not the quick tunnel's password check: with GATE_SSO=on the gate itself
    # refuses to start with a short ACCESS_PASSWORD.
    depends_on: !override
      proxy:
        condition: service_healthy

  # One-shot COLD backup of the bot's data, taken while the bot is stopped: it
  # runs /opt/fugal-bot/backup.sh (bot/backup.sh) from the bot image, as the
  # bot's user, with the bot's home directory mounted read-only. It reads ONE
  # line from standard input: the address to upload to (a presigned PUT URL),
  # so that address is never in the environment, on a command line or in a
  # file. One line of JSON comes back on standard output.
  #
  #   docker compose stop bot
  #   docker compose run --rm -T backup < url.txt
  #   docker compose start bot
  #
  # The archive is encrypted to BACKUP_AGE_RECIPIENT (an age PUBLIC key; the
  # private key never enters the room). A backup of the RUNNING bot ("hot")
  # is not made here: it needs OpenClaw's own export next to the gateway, so
  # it runs inside the bot's container:
  #
  #   docker compose exec -T bot /opt/fugal-bot/backup.sh hot < url.txt
  #
  # Scratch space: the encrypted archive is written to /tmp before it is
  # sent (a presigned PUT needs the length first). /tmp here is the
  # container's own writable layer, which is on the host's disk and is removed
  # with the container (--rm). It is deliberately NOT a tmpfs: that would
  # count against mem_limit and fail for a data directory of some size. For
  # the same reason the root file system is not read-only.
  # Every command, its input, output and exit codes: docs/CATHEDRAL.md,
  # "Controller contract".
  backup:
    profiles: [backup]
    image: ${BOT_IMAGE:-fugal-bot-bot:stage0}
    entrypoint: ["/opt/fugal-bot/backup.sh"]
    command: ["cold"]
    stdin_open: true
    user: "1000:1000"
    network_mode: host   # the only network with outbound access in a room
    healthcheck:
      disable: true      # the image's check is for the running bot
    environment:
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_UPLOAD_TIMEOUT: ${BACKUP_UPLOAD_TIMEOUT:-900}
      HOME: /home/node
      TZ: ${TZ:-UTC}
    volumes:
      # Read-only. A missing data directory must fail the backup, not produce
      # an empty one: create_host_path asks Docker not to create it, and
      # because not every Compose version honours that (5.4 makes an empty
      # directory instead), backup.sh itself refuses a directory without a
      # bot's state in it.
      - type: bind
        source: ${DATA_DIR:?set DATA_DIR}/home
        target: /home/node
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-shot restore: puts a backup back into the bot's home directory with
  # /opt/fugal-bot/restore.sh (bot/restore.sh), as the bot's user. Run it with
  # the bot stopped (it refuses while the gateway answers) and with the data
  # directory empty, or give --force to replace what is there. It reads ONE
  # line from standard input, a presigned GET URL, and the age identity (the
  # PRIVATE key) from a file on the host that is mounted read-only for this
  # one run: RESTORE_IDENTITY_FILE, by default /work/restore/identity.txt
  # (in a room /work is wiped with the room). That file must be readable by
  # uid 1000; delete it afterwards.
  #
  #   docker compose run --rm -T restore < url.txt
  #   docker compose run --rm -T restore --force /run/restore/identity.txt < url.txt
  #
  # volume-init runs first, so an empty or missing DATA_DIR gets its layout
  # (home/ owned by the bot's user) before anything is unpacked. Scratch
  # space (the encrypted object plus the decrypted archive) is /tmp in the
  # container's own writable layer, as for the backup.
  restore:
    profiles: [restore]
    image: ${BOT_IMAGE:-fugal-bot-bot:stage0}
    entrypoint: ["/opt/fugal-bot/restore.sh"]
    command: ["/run/restore/identity.txt"]
    stdin_open: true
    user: "1000:1000"
    network_mode: host
    healthcheck:
      disable: true
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      BACKUP_DOWNLOAD_TIMEOUT: ${BACKUP_DOWNLOAD_TIMEOUT:-900}
      HOME: /home/node
      TZ: ${TZ:-UTC}
    volumes:
      - ${DATA_DIR:?set DATA_DIR}/home:/home/node
      # A missing identity file must fail the restore. Where Compose creates
      # the path anyway (see above) it becomes an empty directory, and
      # restore.sh refuses it: "cannot be read".
      - type: bind
        source: ${RESTORE_IDENTITY_FILE:-/work/restore/identity.txt}
        target: /run/restore/identity.txt
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
