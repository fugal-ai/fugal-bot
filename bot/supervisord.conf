; Runs as the unprivileged `node` user (uid 1000). No process here is root.
[supervisord]
nodaemon=true
user=node
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; No control socket ([unix_http_server]/[supervisorctl]): supervisord creates
; it under a temporary name and hard-links it into place, which gVisor's file
; system refuses (endless "Unlinking stale socket"). Nothing uses supervisorctl.

; --- the bot's screen -------------------------------------------------------
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_DESKTOP_GEOMETRY)sx24 -nolisten tcp -ac
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox-session
environment=DISPLAY=":1"
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/null
redirect_stderr=true

; VNC server: loopback only, inside the container. Not reachable from outside
; the container; the owner reaches it via noVNC behind the password proxy.
[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -rfbport 5900 -localhost -forever -shared -passwdfile %(ENV_VNC_PASSWORD_FILE)s -quiet -noxdamage
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/null
redirect_stderr=true

; noVNC web client + websocket bridge. Listens on the internal compose network
; only (the proxy is the sole published port).
[program:novnc]
command=/usr/bin/websockify --web /tmp/novnc-web %(ENV_NOVNC_LISTEN)s 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

; --- the agent ----------------------------------------------------------------
[program:gateway]
command=/opt/fugal-bot/start-gateway.sh
environment=DISPLAY=":1"
priority=50
autorestart=true
startsecs=10
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
