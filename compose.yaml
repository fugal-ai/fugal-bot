# One bot = this compose application. One published port (the proxy), one
# persistent volume (botdata), no host bind mounts, no Docker socket, no host
# network, nothing privileged. The model API key lives only in the modelproxy
# service, never in the bot. Start: `cp .env.example .env`, edit, then
# `docker compose up -d --build`.
name: ${BOT_NAME:-fugal-bot}

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # Lays out the one volume at every start: home/ for the bot, proxy/ for TLS
  # state, modelproxy/ for the token counters (each owned by its own user).
  volume-init:
    image: caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    entrypoint: ["/bin/sh", "-c", "mkdir -p /v/home /v/proxy /v/modelproxy && chown 1000:1000 /v/home && chmod 700 /v/home && chown 1001:1001 /v/proxy && chmod 700 /v/proxy && chown 1002:1002 /v/modelproxy && chmod 700 /v/modelproxy"]
    user: "0:0"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - botdata:/v
    restart: "no"

  bot:
    <<: *hardening
    build:
      context: ./bot
    # Set BOT_IMAGE to a published, digest-pinned image to skip the local build
    # (then `docker compose pull bot` before `up`).
    image: ${BOT_IMAGE:-fugal-bot-bot:stage0}
    hostname: bot
    stop_grace_period: 45s
    depends_on:
      volume-init:
        condition: service_completed_successfully
      modelproxy:
        condition: service_healthy
    environment:
      # The agent never gets the model endpoint's key: it talks to the
      # modelproxy service, which adds the real key (see SECURITY-NOTES.md).
      MODEL_BASE_URL: http://modelproxy:9001/v1
      MODEL_API_KEY: held-by-modelproxy   # a placeholder, not a secret
      MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME in .env}
      MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:-32768}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-4096}
      MODEL_REASONING: ${MODEL_REASONING:-false}
      MODEL_SUPPORTS_TOOLS: ${MODEL_SUPPORTS_TOOLS:-true}
      ENABLE_OPENAI_API: ${ENABLE_OPENAI_API:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      EXEC_MODE: ${EXEC_MODE:-full}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      PROXY_PORT: ${PORT:-8080}
      PROXY_IP: ${FRONT_NET:-10.213.57}.10
      CONTROL_UI_ORIGIN: ${CONTROL_UI_ORIGIN:-https://bot.invalid}   # shared with the proxy
      DESKTOP_GEOMETRY: ${DESKTOP_GEOMETRY:-1280x800}
      TZ: ${TZ:-UTC}
      # ---- optional: identity, first run, model extras, backups (.env.example) ----
      BOT_DISPLAY_NAME: ${BOT_DISPLAY_NAME:-}
      BOT_EMOJI: ${BOT_EMOJI:-}
      UI_ACCENT_COLOR: ${UI_ACCENT_COLOR:-}
      SEED_WORKSPACE: ${SEED_WORKSPACE:-}
      OWNER_WALLET_SS58: ${OWNER_WALLET_SS58:-}   # a public address, not a secret
      MODEL_INPUT: ${MODEL_INPUT:-text}
      MODEL_EXTRA_BODY: ${MODEL_EXTRA_BODY:-}
      MODEL_STREAM_USAGE: ${MODELPROXY_STREAM_USAGE:-true}   # one switch for both
      BACKGROUND_MODEL_USE: ${BACKGROUND_MODEL_USE:-}
      ACTIVITY_RECAP: ${ACTIVITY_RECAP:-}
      TOOLS_DENY: ${TOOLS_DENY:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}   # an age PUBLIC key
    volumes:
      - type: volume
        source: botdata
        target: /home/node
        volume:
          subpath: home
    networks:
      front:
        ipv4_address: ${FRONT_NET:-10.213.57}.11
      modelnet: {}
    shm_size: "1gb"
    mem_limit: ${BOT_MEM_LIMIT:-2560m}
    cpus: ${BOT_CPUS:-2.0}
    pids_limit: 1024

  # The only holder of the model endpoint and its API key. The bot reaches it
  # on the internal "modelnet" network; it adds the key, counts tokens and
  # enforces the optional budget. No published port; not behind the proxy.
  modelproxy:
    <<: *hardening
    build:
      context: ./modelproxy
    image: ${MODELPROXY_IMAGE:-fugal-bot-modelproxy:stage0}
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:?set MODEL_BASE_URL in .env}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      # Optional hard caps (empty or 0 = no limit); see .env.example.
      BUDGET_TOKENS_PER_DAY: ${BUDGET_TOKENS_PER_DAY:-}
      BUDGET_TOKENS_TOTAL: ${BUDGET_TOKENS_TOTAL:-}
      BUDGET_PRICES: ${BUDGET_PRICES:-}
      BUDGET_USD_PER_DAY: ${BUDGET_USD_PER_DAY:-}
      BUDGET_USD_TOTAL: ${BUDGET_USD_TOTAL:-}
      BUDGET_REQUESTS_PER_MINUTE: ${BUDGET_REQUESTS_PER_MINUTE:-}
      MODELPROXY_STREAM_USAGE: ${MODELPROXY_STREAM_USAGE:-true}
      # How a call is answered once a cap is reached (see docs/MODELPROXY.md).
      MODELPROXY_EXHAUSTED_REPLY: ${MODELPROXY_EXHAUSTED_REPLY:-}
    volumes:
      - type: volume
        source: botdata
        target: /data
        volume:
          subpath: modelproxy
    networks: [modelnet, modelegress]
    # Lets the model proxy reach a model server on this host (the stage-0
    # Ollama test). Remove on a server that runs no local model.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python3", "-I", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9001/healthz',timeout=15)"]
      # Tolerant on purpose: while the bot starts a small room is starved of CPU
      # for minutes, and a 5 s timeout made this service show "unhealthy" in that
      # time. The bot waits for it to be healthy (depends_on), and a start period
      # does not count failures: the first passing check makes it healthy at once.
      interval: 10s
      timeout: 20s
      retries: 6
      start_period: 120s

  gate:
    <<: *hardening
    build:
      context: ./gate
    image: ${GATE_IMAGE:-fugal-bot-gate:stage0}
    environment:
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:?set ACCESS_PASSWORD in .env}
      BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      SESSION_HOURS: ${SESSION_HOURS:-168}
      # Optional lines on the login page (shown only when set; HTML-escaped).
      HOST_LABEL: ${HOST_LABEL:-}
      MODEL_LABEL: ${MODEL_LABEL:-}
      REPO_URL: ${REPO_URL:-}
      # Hosted mode only (.env.example, "hosted mode"): sign-in by a one-time
      # token from the page that frames the bot, instead of the password.
      GATE_SSO: ${GATE_SSO:-}
      GATE_BOT_ID: ${GATE_BOT_ID:-}
      GATE_LOGIN_URL: ${GATE_LOGIN_URL:-}
      GATE_PARENT_ORIGIN: ${GATE_PARENT_ORIGIN:-}
    networks: [gatenet]
    read_only: true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python3", "-I", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/_gate/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  proxy:
    <<: *hardening
    build:
      context: ./proxy
    image: ${PROXY_IMAGE:-fugal-bot-proxy:stage0}
    depends_on:
      volume-init:
        condition: service_completed_successfully
      gate:
        condition: service_healthy
    environment:
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:?set ACCESS_PASSWORD in .env}
      BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ALLOW_PUBLIC_HTTP: ${ALLOW_PUBLIC_HTTP:-}
      TUNNEL_IP: ${TUNNEL_NET:-10.213.58}.10
      CONTROL_UI_ORIGIN: ${CONTROL_UI_ORIGIN:-https://bot.invalid}   # shared with the bot
      # Hosted mode only: with GATE_SSO=on the proxy lets that one origin
      # (and no other) show the bot in a frame.
      GATE_SSO: ${GATE_SSO:-}
      GATE_LOGIN_URL: ${GATE_LOGIN_URL:-}
      GATE_PARENT_ORIGIN: ${GATE_PARENT_ORIGIN:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8443"
    volumes:
      - type: volume
        source: botdata
        target: /data
        volume:
          subpath: proxy
    networks:
      front:
        ipv4_address: ${FRONT_NET:-10.213.57}.10
      gatenet: {}
      tunnelnet:
        ipv4_address: ${TUNNEL_NET:-10.213.58}.2
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/_proxy/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- optional: a public HTTPS URL without any inbound address --------------
  # `docker compose --profile tunnel up -d` adds a Cloudflare quick tunnel (no
  # account): cloudflared dials out to Cloudflare, which then serves
  # https://<random>.trycloudflare.com -> proxy. The URL is printed in the logs
  # (`docker compose logs tunnel-url`) and written to TUNNEL_URL.txt at the top
  # of the data volume / DATA_DIR. ACCESS_PASSWORD (>= 12 chars) is mandatory.
  tunnel-guard:
    profiles: [tunnel]
    image: caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:?set ACCESS_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c", "if [ $${#ACCESS_PASSWORD} -ge 12 ]; then echo '[tunnel] password ok'; else echo '[tunnel] refusing: ACCESS_PASSWORD must be at least 12 characters when the tunnel is on' >&2; exit 1; fi"]
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  tunnel:
    <<: *hardening
    profiles: [tunnel]
    # cloudflared 2026.11.1, pinned by digest.
    image: cloudflare/cloudflared@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://proxy:8443"]
    depends_on:
      tunnel-guard:
        condition: service_completed_successfully
      proxy:
        condition: service_healthy
    networks:
      tunnelnet:
        ipv4_address: ${TUNNEL_NET:-10.213.58}.10
    mem_limit: 128m
    cpus: 0.5

  tunnel-url:
    <<: *hardening
    profiles: [tunnel]
    build:
      context: ./proxy   # same image as the proxy (it carries the script)
    image: ${PROXY_IMAGE:-fugal-bot-proxy:stage0}
    user: "0:0"
    depends_on: [tunnel]
    entrypoint: ["/bin/sh", "/usr/local/bin/fugal-bot-tunnel-url"]
    volumes:
      - botdata:/v
    networks: [tunnelnet]
    read_only: true
    mem_limit: 32m
    cpus: 0.1

networks:
  # bot <-> proxy. Fixed addresses: the gateway trusts identity headers only
  # from the proxy's address (<FRONT_NET>.10), never from anything else.
  # FRONT_NET / TUNNEL_NET (first three octets) can be changed in .env if these
  # /28 ranges clash with another network on the host.
  front:
    ipam:
      config:
        - subnet: ${FRONT_NET:-10.213.57}.0/28
  # proxy <-> gate. No outbound access at all.
  gatenet:
    internal: true
  # bot <-> modelproxy. No outbound access; the public proxy is not on it.
  modelnet:
    internal: true
  # modelproxy -> the model endpoint (outbound).
  modelegress: {}
  # proxy <-> optional tunnel (cloudflared needs outbound to Cloudflare).
  tunnelnet:
    ipam:
      config:
        - subnet: ${TUNNEL_NET:-10.213.58}.0/28

volumes:
  # The ONE persistent volume. To keep it in a host directory instead (e.g.
  # under /workspace on a sandbox host), set DATA_DIR and
  # COMPOSE_FILE=compose.yaml:compose.datadir.yaml in .env.
  botdata:
